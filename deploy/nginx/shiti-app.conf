# 拾题 · 智能错题本 —— 反向代理与应用侧请求头治理
#
# 由 8095 直连（sites-available/shiti-mistake-notebook）与
# study.zxai.studio（sites-available/study.zxai.studio）共用，
# 两个 server block 的 `location /` 都 include 本文件。
#
# 登录已改由应用自己实现（/login 页面 + /api/auth/login），nginx 不再做 basic auth。
#
# ⚠️ 只要有任何 location 块自己写了一条 proxy_set_header，server 层的同名设置
# 会被整体丢弃。所以这些指令必须跟着 include 一起走，别复制到别处去。

proxy_pass http://127.0.0.1:3105;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
# 保留 Host 的端口，避免 IP:8095 浏览器 Origin 与代理 Host 不一致。
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# 应用靠它决定会话 cookie 要不要加 Secure。worker 看到的 request.url 永远是
# http://127.0.0.1:3105，不看这个头的话 https 入口会拿不到 cookie。
proxy_set_header X-Forwarded-Proto $scheme;

# 平台身份头一律置空。应用只在 TRUST_OAI_HEADERS=1（仅本地开发）时才认它们，
# 这里再清一道：万一环境变量配错，外人也塞不进来。
proxy_set_header oai-authenticated-user-id "";
proxy_set_header oai-authenticated-user-email "";
proxy_set_header oai-authenticated-user-full-name "";
proxy_set_header oai-authenticated-user-full-name-encoding "";
proxy_set_header CF-Connecting-IP "";

# 只对登录接口生效；其余请求 key 为空，nginx 不计数（见 conf.d/shiti-limit.conf）
limit_req zone=shiti_login burst=5 nodelay;

# AI 图片分析耗时长，超时给足
proxy_read_timeout 300s;
proxy_send_timeout 300s;
